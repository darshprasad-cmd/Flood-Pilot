<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>दिशाAI — Know the Safest Way Forward</title>
    <meta
      name="description"
      content="AI urban flood intelligence for Delhi NCR, in a single file. Risk-based routing, vehicle survivability and explainable predictions."
    />
    <style>/*__LEAFLET_CSS__*/</style>
    <style>
      :root {
        --ink-950: #05070b;
        --ink-900: #090d15;
        --ink-850: #0e131e;
        --ink-800: #141a28;
        --line: #1c2434;
        --line-bright: #2a3549;
        --fg: #e9eef7;
        --fg-muted: #97a4bb;
        --fg-faint: #5f6c85;
        --signal: #2b8cf0;
      }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; margin: 0; }
      body {
        background: var(--ink-950);
        color: var(--fg);
        font: 400 14px/1.5 "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        -webkit-font-smoothing: antialiased;
        overflow: hidden;
      }
      /* Devanagari needs a face that can actually render it. */
      #brand { font-family: "Noto Sans Devanagari", ui-sans-serif, system-ui, sans-serif; }

      .app { display: flex; flex-direction: column; height: 100dvh; height: 100vh; }
      @supports (height: 100dvh) { .app { height: 100dvh; } }

      header {
        display: flex; align-items: center; gap: 12px;
        padding: max(10px, env(safe-area-inset-top)) 16px 10px;
        border-bottom: 1px solid var(--line);
        background: var(--ink-900);
        flex-shrink: 0;
      }
      #brand { font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
      #tagline { font-size: 11px; color: var(--fg-faint); }
      header select {
        margin-left: auto; background: var(--ink-850); color: var(--fg);
        border: 1px solid var(--line); border-radius: 8px; padding: 7px 9px; font-size: 12px;
        max-width: 46vw;
      }

      .body { display: flex; flex: 1; min-height: 0; }
      #map { flex: 1; min-width: 0; background: var(--ink-950); }
      .leaflet-container { background: var(--ink-950) !important; }
      .leaflet-tile-pane { filter: saturate(0.35) brightness(0.62) contrast(1.06); }

      aside {
        width: 360px; flex-shrink: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
        border-left: 1px solid var(--line); background: var(--ink-900);
        padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom));
      }
      @media (max-width: 860px) {
        .body { flex-direction: column; }
        #map { height: 46vh; flex: none; }
        aside { width: auto; border-left: 0; border-top: 1px solid var(--line); }
      }

      h3 { margin: 4px 0 12px; font-size: 15px; font-weight: 600; letter-spacing: -0.01em; }
      .eyebrow {
        margin: 0 0 8px; font-size: 10px; font-weight: 600; letter-spacing: 0.12em;
        text-transform: uppercase; color: var(--fg-faint);
      }
      .muted { color: var(--fg-muted); font-size: 12.5px; line-height: 1.6; }

      #stats { display: flex; gap: 10px; margin-bottom: 18px; }
      .stat {
        flex: 1; background: var(--ink-850); border: 1px solid var(--line);
        border-radius: 12px; padding: 10px 12px;
      }
      .stat span { display: block; font-size: 10px; text-transform: uppercase;
        letter-spacing: 0.1em; color: var(--fg-faint); margin-bottom: 5px; }
      .stat b { font-size: 19px; font-weight: 600; font-variant-numeric: tabular-nums; }

      .field { margin-bottom: 10px; }
      .field span { display: block; font-size: 10px; text-transform: uppercase;
        letter-spacing: 0.1em; color: var(--fg-faint); margin-bottom: 5px; }
      select, button {
        width: 100%; background: var(--ink-850); color: var(--fg);
        border: 1px solid var(--line); border-radius: 10px; padding: 10px;
        font-size: 16px; font-family: inherit;
      }
      button {
        background: var(--signal); border-color: var(--signal); color: #fff;
        font-weight: 600; font-size: 14px; cursor: pointer; min-height: 44px; margin-top: 6px;
      }
      button:hover { background: #4aa8ff; }

      .route {
        border: 1px solid var(--line-bright); border-radius: 12px;
        padding: 12px 14px; margin-bottom: 10px; background: var(--ink-850);
      }
      .row {
        display: flex; justify-content: space-between; gap: 12px;
        padding: 5px 0; font-size: 12.5px; color: var(--fg-muted);
      }
      .row b { color: var(--fg); font-variant-numeric: tabular-nums; }
      .row.impassable b { color: #e8503a; }

      .blockage { padding: 8px 0; border-top: 1px solid var(--line); }
      .blockage b { display: block; font-size: 12.5px; }
      .blockage span { font-size: 11.5px; color: var(--fg-faint); line-height: 1.5; }

      hr { border: 0; border-top: 1px solid var(--line); margin: 18px 0; }
      #status {
        padding: 8px 16px; font-size: 11px; color: var(--fg-faint);
        border-top: 1px solid var(--line); background: var(--ink-900);
        flex-shrink: 0; padding-bottom: max(8px, env(safe-area-inset-bottom));
      }
    </style>

    <!-- ══ Intro overlay ═══════════════════════════════════════════════════
         Owned end to end by src/single/intro.ts, and kept in its own <style>
         so edits to the layout above and edits to the opening moment cannot
         land on the same lines.

         The load-bearing idea: every element's *base* style is its finished
         state, and the keyframes animate into it from hidden. That inversion
         is what makes `.intro-static` a one-line escape hatch — switch the
         animations off and the composition is already correct, which is the
         only thing that renders on a surface where the animation timeline
         never advances. -->
    <style>
      #intro {
        position: fixed; inset: 0; z-index: 60;
        display: flex; align-items: center; justify-content: center;
        background: var(--ink-950);
        /* Decorates the boot; never gates it. The skip button opts back in. */
        pointer-events: none;
      }
      /* An id rule outranks the UA stylesheet, so `hidden` needs saying twice. */
      #intro[hidden] { display: none; }

      #intro-stage { display: flex; flex-direction: column; align-items: center; }
      /* Fixed size so the wordmark below does not jump as the rings grow. */
      #intro-orbit {
        position: relative; width: 224px; height: 224px;
        display: flex; align-items: center; justify-content: center;
      }

      /* Water leaving the source. Staggered so it reads as a sequence of waves
         rather than one thick expanding band. */
      .intro-ripple {
        position: absolute; width: 128px; height: 128px; border-radius: 50%;
        border: 1px solid rgba(47, 191, 111, 0.5);
        opacity: 0; transform: scale(4);
        animation: intro-ripple 2.1s cubic-bezier(0.16, 1, 0.3, 1) both;
      }
      .intro-ripple:nth-child(1) { animation-delay: 420ms; }
      .intro-ripple:nth-child(2) { animation-delay: 720ms; }
      .intro-ripple:nth-child(3) { animation-delay: 1020ms; }
      .intro-ripple:nth-child(4) { animation-delay: 1320ms; }

      #intro-halo {
        position: absolute; width: 224px; height: 224px; border-radius: 50%;
        background: radial-gradient(circle, rgba(47, 191, 111, 0.55), rgba(47, 191, 111, 0.06) 60%, transparent 72%);
        filter: blur(64px);
        opacity: 0.6; transform: scale(1.25);
        animation: intro-halo 1.8s ease-out both;
      }

      #intro-orb {
        position: relative; width: 70px; height: 70px; border-radius: 50%;
        /* Lit from the upper left so it reads as a sphere, not a disc. */
        background: radial-gradient(circle at 38% 34%, #d6f7e5, #4fd894 34%, #2fbf6f 62%, #148a4f 100%);
        box-shadow:
          0 0 28px 6px rgba(47, 191, 111, 0.55),
          0 0 90px 26px rgba(47, 191, 111, 0.28),
          inset 0 0 22px rgba(255, 255, 255, 0.28);
        opacity: 1; transform: scale(1.06);
        animation: intro-orb 1.5s cubic-bezier(0.22, 1, 0.36, 1) both;
      }

      /* One pass of light across the orb — the instrument checking itself. */
      #intro-scan {
        position: absolute; width: 160px; height: 2px; opacity: 0;
        background: linear-gradient(90deg, transparent, rgba(214, 247, 229, 0.85), transparent);
        animation: intro-scan 1.6s cubic-bezier(0.4, 0, 0.2, 1) 700ms both;
      }

      /* Devanagari needs a face that can actually render it — same stack as
         #brand, for the same reason. */
      #intro-word {
        margin-top: -14px;
        font-family: "Noto Sans Devanagari", ui-sans-serif, system-ui, sans-serif;
        font-size: 44px; font-weight: 600; letter-spacing: -0.01em; line-height: 1.15;
        animation: intro-rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1250ms both;
      }
      #intro-tagline {
        margin-top: 16px; font-size: 12.5px; letter-spacing: 0.16em;
        text-transform: uppercase; color: var(--fg-faint); text-align: center;
        padding: 0 24px;
        animation: intro-rise 1.1s cubic-bezier(0.16, 1, 0.3, 1) 1850ms both;
      }

      /* Any tap anywhere already ends the intro; this is the version you can
         see, for the people who do not know that. */
      #intro-skip-slot {
        position: absolute; left: 0; right: 0;
        bottom: max(24px, env(safe-area-inset-bottom));
        display: flex; justify-content: center; pointer-events: none;
      }
      #intro-skip {
        pointer-events: auto;
        width: auto; margin: 0; min-height: 44px; padding: 0 20px;
        background: transparent; border: 1px solid var(--line-bright); border-radius: 999px;
        color: var(--fg-faint); font-size: 11px; font-weight: 600;
        letter-spacing: 0.14em; text-transform: uppercase;
        animation: intro-rise 0.8s ease 2200ms both;
      }
      #intro-skip:hover { background: transparent; color: var(--fg); border-color: var(--fg-faint); }

      @keyframes intro-orb {
        0%   { opacity: 0;    transform: scale(0.18); }
        10%  { opacity: 0.85; transform: scale(0.5); }
        15%  { opacity: 0.2;  transform: scale(0.47); }
        23%  { opacity: 1;    transform: scale(0.72); }
        29%  { opacity: 0.38; transform: scale(0.7); }
        36%  { opacity: 1;    transform: scale(0.88); }
        41%  { opacity: 0.66; transform: scale(0.87); }
        52%  { opacity: 1;    transform: scale(1); }
        100% { opacity: 1;    transform: scale(1.06); }
      }
      /* The glow breathes slightly out of step with the core, which is what
         stops the whole thing reading as one flat shape pulsing. */
      @keyframes intro-halo {
        0%   { opacity: 0;    transform: scale(0.4); }
        30%  { opacity: 0.5;  transform: scale(0.9); }
        60%  { opacity: 0.85; transform: scale(1.1); }
        100% { opacity: 0.6;  transform: scale(1.25); }
      }
      @keyframes intro-ripple {
        0%   { opacity: 0.6;  transform: scale(0.3); }
        70%  { opacity: 0.18; }
        100% { opacity: 0;    transform: scale(4); }
      }
      /* The wordmark does not fade in, it surfaces — up through the blur, the
         way the compass mark resolves out of the orb's glow. */
      @keyframes intro-rise {
        0%   { opacity: 0; transform: translateY(14px); filter: blur(10px); letter-spacing: 0.18em; }
        60%  { opacity: 1; filter: blur(0); }
        100% { opacity: 1; transform: none; filter: blur(0); letter-spacing: normal; }
      }
      @keyframes intro-scan {
        0%   { opacity: 0;   transform: translateY(-140px); }
        20%  { opacity: 0.7; }
        80%  { opacity: 0.7; }
        100% { opacity: 0;   transform: translateY(140px); }
      }
      /* Pulls very slightly toward the viewer as it goes, so the map arrives
         rather than the overlay merely vanishing. */
      @keyframes intro-out {
        0%   { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.06); }
      }
      #intro.intro-leaving { animation: intro-out 0.7s ease-in both; }

      /* No timeline. Drop every animation and let the resting styles stand —
         plus a still fan of rings, since a ripple's resting state is spent. */
      #intro.intro-static, #intro.intro-static * { animation: none !important; }
      #intro.intro-static #intro-scan { opacity: 0; }
      #intro.intro-static .intro-ripple:nth-child(1) { opacity: 0.5;  transform: scale(1.0); }
      #intro.intro-static .intro-ripple:nth-child(2) { opacity: 0.34; transform: scale(1.55); }
      #intro.intro-static .intro-ripple:nth-child(3) { opacity: 0.2;  transform: scale(2.1); }
      #intro.intro-static .intro-ripple:nth-child(4) { opacity: 0.1;  transform: scale(2.65); }
      #intro.intro-static.intro-leaving { opacity: 0; }

      /* intro.ts declines before it ever reveals the overlay; this is the
         belt to that pair of braces. */
      @media (prefers-reduced-motion: reduce) {
        #intro { display: none !important; }
      }
    </style>
    <!-- ══ end intro overlay ═══════════════════════════════════════════ -->
  </head>
  <body>
    <div class="app">
      <header>
        <div>
          <div id="brand">दिशाAI</div>
          <div id="tagline">Know the Safest Way Forward.</div>
        </div>
        <select id="scenario" aria-label="Rainfall scenario"></select>
      </header>

      <div class="body">
        <div id="map"></div>
        <aside>
          <div id="stats"></div>

          <p class="eyebrow">Plan a journey</p>
          <label class="field"><span>From</span><select id="from"></select></label>
          <label class="field"><span>To</span><select id="to"></select></label>
          <label class="field"><span>Vehicle</span><select id="vehicle"></select></label>
          <button id="plan" type="button">Plan this journey</button>

          <div id="routes" style="margin-top:16px"></div>
          <hr />
          <div id="detail">
            <p class="eyebrow">Road detail</p>
            <p class="muted">Select any road on the map to see its modelled depth, timing and failure modes.</p>
          </div>
        </aside>
      </div>

      <div id="status">Starting…</div>
    </div>

    <!-- ══ Intro overlay ═══════════════════════════════════════════════════
         Markup only; src/single/intro.ts owns it. `hidden` until that module
         decides to play, so a page where the bundle never runs shows the app
         rather than a curtain with nothing left alive to lift it. Styles for
         all of this are in the matching block in <head>. -->
    <div id="intro" hidden>
      <div id="intro-stage">
        <div id="intro-orbit" aria-hidden="true">
          <span class="intro-ripple"></span>
          <span class="intro-ripple"></span>
          <span class="intro-ripple"></span>
          <span class="intro-ripple"></span>
          <span id="intro-halo"></span>
          <span id="intro-orb"></span>
          <span id="intro-scan"></span>
        </div>
        <!-- The mark is a name, not a sentence: keep it out of translation
             and out of any RTL flip. -->
        <div id="intro-word" dir="ltr" translate="no">दिशाAI</div>
        <div id="intro-tagline">Know the Safest Way Forward</div>
      </div>
      <div id="intro-skip-slot">
        <button id="intro-skip" type="button" aria-label="Skip intro">Skip</button>
      </div>
    </div>
    <!-- ══ end intro overlay ═══════════════════════════════════════════ -->

    <script>window.__DISHA_OSM__ = /*__OSM_JSON__*/null;</script>
    <script>/*__BUNDLE__*/</script>
  </body>
</html>
